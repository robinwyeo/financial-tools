name: Weekly Watchlist Scorecard

on:
  schedule:
    # Mondays 14:00 UTC ≈ 7:00 AM Pacific (adjust if your timezone differs)
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watchlist-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Validate SMTP secrets
        env:
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          missing=0
          for var in SMTP_FROM SMTP_TO SMTP_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing secret::${var} is not set in repo Settings → Secrets → Actions"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "SMTP secrets present (from=${SMTP_FROM}, to=${SMTP_TO})"

      - name: Run weekly watchlist scorecard
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python jobs/watchlist_weekly.py

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-summary
          path: data/runs/
          if-no-files-found: warn
